[package]
name = "agent-vault"
version = "0.1.0"
edition = "2021"
description = "Agent Vault — a policy-enforced vault for an AI agent's funds on NEAR (NEAR Hackathon 2026, track 06 AI Security & Defense)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
